<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      // Anti-flash: sets data-theme before any CSS/JS loads, so a
      // returning light-mode visitor doesn't briefly see the dark
      // default. Keep the 'portfolio-theme' key in sync with
      // src/utils/theme.js, which owns the toggle itself.
      (function () {
        try {
          if (window.localStorage.getItem('portfolio-theme') === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0"
    />
    <link rel="icon" href="<%= BASE_URL %>my.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Fira+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <meta name="description" content="Muhammad Jawad Haider — Software Engineer specializing in Vue.js and Node.js. Browse my projects and get in touch." />
    <meta name="theme-color" content="#1c1d20" />
    <link rel="canonical" href="https://mjawadhaider.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Muhammad Jawad Haider — Software Engineer" />
    <meta property="og:description" content="Software Engineer specializing in Vue.js and Node.js. Browse my projects and get in touch." />
    <meta property="og:image" content="<%= BASE_URL %>og-image.png" />
    <meta property="og:url" content="https://mjawadhaider.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Muhammad Jawad Haider — Software Engineer" />
    <meta name="twitter:description" content="Software Engineer specializing in Vue.js and Node.js. Browse my projects and get in touch." />
    <meta name="twitter:image" content="<%= BASE_URL %>og-image.png" />

    <title><%= htmlWebpackPlugin.options.title %></title>
  </head>
  <body>
    <noscript>
      <strong
        >We're sorry but <%= htmlWebpackPlugin.options.title %>
        doesn't work properly without JavaScript enabled. Please
        enable it to continue.</strong
      >
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
